<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | MMD4Mecanim</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #unity-container {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0 !important;
      left: 0 !important;
      transform: none !important;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1" style="width: 100%; height: 100%;"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">MMD4Mecanim</div>
    </div>
  </div>
  <script>

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/game.loader.js";
    var config = {
      // dataUrl: buildUrl + "/game.data", // Replaced by dynamic Blob URL
      frameworkUrl: buildUrl + "/game.framework.js",
      codeUrl: buildUrl + "/game.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "MMD4Mecanim",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;
    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      console.log("Unity loader script loaded. Starting split part downloads...");
      var partSuffixes = ["1a", "1b", "2a", "2b", "3a", "3b"];
      var totalParts = partSuffixes.length;
      var parts = new Array(totalParts); // 0-indexed for simplicity here
      var loadedParts = 0;

      function checkAndLoad() {
        loadedParts++;
        console.log(`Part download progress: ${loadedParts}/${totalParts}`);
        if (loadedParts === totalParts) {
          console.log("All data parts downloaded. Merging into Blob...");
          var blob = new Blob(parts, { type: "application/octet-stream" });

          // Immediately release individual part buffers
          for (var i = 0; i < totalParts; i++) {
            parts[i] = null;
          }

          var url = URL.createObjectURL(blob);
          config.dataUrl = url;
          console.log("Blob URL created. Initializing Unity instance...");

          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            console.log("Unity instance successfully created!");
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };

            var resumeAudio = () => {
              const audioCtx = (unityInstance.Module && unityInstance.Module.SDL2 && unityInstance.Module.SDL2.audioContext);
              if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
              }
            };
            ['mousedown', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, resumeAudio, { once: true }));

          }).catch((message) => {
            console.error("Unity Initialization Failed:", message);
            unityShowBanner("Error: " + (message.message || message), 'error');
          });
        }
      }

      function loadPart(suffix, index) {
        console.log(`Requesting part ${suffix}...`);
        var xhr = new XMLHttpRequest();
        xhr.open("GET", buildUrl + "/game.data.part" + suffix, true);
        xhr.responseType = "arraybuffer";
        xhr.onload = (e) => {
          if (xhr.status == 200) {
            console.log(`Part ${suffix} successfully received.`);
            parts[index] = xhr.response;
            checkAndLoad();
          } else {
            console.error(`Status ${xhr.status} when loading part ${suffix}`);
            unityShowBanner("Failed to load data part " + suffix, 'error');
          }
        };
        xhr.onerror = () => {
          console.error(`Network error loading part ${suffix}`);
          unityShowBanner("Network error during game load.", 'error');
        };
        xhr.send();
      }

      partSuffixes.forEach((suffix, index) => {
        loadPart(suffix, index);
      });
    };

    document.body.appendChild(script);

  </script>
</body>

</html>
